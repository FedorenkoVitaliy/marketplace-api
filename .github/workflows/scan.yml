name: scan

on:
  pull_request:
  push:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build token
        run: printf 'dummy-npm-token' > .npm_token
      - name: image
        run: npm run image:build
      - name: gate
        run: npm run scan
        env:
          SCAN_MAX: "99999"
