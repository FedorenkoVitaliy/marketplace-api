name: teardown

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: LocalStack
        run: |
          docker run -d --name hw31-localstack \
            --publish 127.0.0.1:23166:4566 \
            --memory 1g \
            -e AWS_DEFAULT_REGION=eu-central-1 \
            localstack/localstack:4.14.0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:23166/_localstack/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs hw31-localstack
          exit 1

      - name: dependencies
        run: |
          npm ci --prefix infra/base
          npm ci --prefix infra/demo

      - name: pulumi
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version 3.277.0
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: destroy
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID=test
          export AWS_REGION=eu-central-1
          export AWS_DEFAULT_REGION=eu-central-1
          export AWS_EC2_METADATA_DISABLED=true
          export AWS_PAGER=
          export PULUMI_BACKEND_URL="file://${RUNNER_TEMP}/pulumi-state"
          export PULUMI_CONFIG_PASSPHRASE=hw31-local
          export PULUMI_SKIP_UPDATE_CHECK=true
          unset AWS_PROFILE AWS_SESSION_TOKEN AWS_SECURITY_TOKEN
          export AWS_SECRET_ACCESS_KEY=test

          EP=http://127.0.0.1:23166
          mkdir -p "${PULUMI_BACKEND_URL#file://}"
          pulumi login "$PULUMI_BACKEND_URL"

          cd "$GITHUB_WORKSPACE/infra/base"
          pulumi stack select base --create --non-interactive
          # Budgets на community-ліцензії LocalStack відповідає 501. Решта стеку створюється попри цю помилку.
          set +e
          pulumi up --yes --non-interactive --continue-on-error --stack base
          base_up=$?
          set -e
          vpc_id="$(pulumi stack output vpcId --stack base)"
          if [ -z "$vpc_id" ]; then
            echo "base не віддав vpcId, код ${base_up}" >&2
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/infra/demo"
          pulumi stack select demo --create --non-interactive
          set +e
          pulumi up --yes --non-interactive --stack demo
          demo_up=$?
          set -e
          if [ "$demo_up" -ne 0 ]; then
            # Немає активного оновлення — cancel повертає помилку, destroy усе одно має пройти.
            pulumi cancel --yes --stack demo || true
          fi

          pulumi destroy --yes --non-interactive --stack demo
          state="$(pulumi stack export --stack demo | jq '[.deployment.resources[]? | select(.type | startswith("aws:"))] | length')"

          cd "$GITHUB_WORKSPACE/infra/base"
          pulumi destroy --yes --non-interactive --stack base

          num() {
            local name="$1" value="$2"
            value="${value//[[:space:]]/}"
            if [[ ! "$value" =~ ^[0-9]+$ ]]; then
              echo "${name} не число: ${value:-порожньо}" >&2
              exit 1
            fi
            printf '%s' "$value"
          }
          # RDS/ELBv2 на community LocalStack відповідають 501. Це не «нуль ресурсів».
          count_aws() {
            local name="$1" soft501="$2"
            shift 2
            local raw trimmed
            set +e
            raw="$(aws "$@" --output text 2>&1)"
            set -e
            trimmed="${raw//[[:space:]]/}"
            if [[ "$trimmed" =~ ^[0-9]+$ ]]; then
              printf '%s' "$trimmed"
              return 0
            fi
            if [ "$soft501" = "501" ] && echo "$raw" | grep -qiE '501|NotImplemented|not implemented|license'; then
              printf '%s' "unavailable"
              return 0
            fi
            echo "${name} не число: ${raw:-порожньо}" >&2
            exit 1
          }
          tagged_region() {
            aws resourcegroupstaggingapi get-resources --endpoint-url "$EP" --region "$1" \
              --tag-filters Key=Project,Values=nodejs-pro-hw31 Key=Stack,Values=demo \
              --query "length(ResourceTagMappingList[?!contains(ResourceARN, ':natgateway/')])" --output text
          }
          require_zero() {
            local name="$1" value="$2"
            if [ "$value" != "0" ]; then
              echo "${name} має бути 0: ${value}" >&2
              exit 1
            fi
          }
          require_zero_or_unavailable() {
            local name="$1" value="$2"
            if [ "$value" != "0" ] && [ "$value" != "unavailable" ]; then
              echo "${name} має бути 0 або unavailable: ${value}" >&2
              exit 1
            fi
          }

          R="$AWS_REGION"
          state="$(num state-resources-left "$state")"
          echo "state-resources-left=$state"

          tagged_here="$(tagged_region "$R")"
          tagged_east="$(tagged_region us-east-1)"
          tagged="$(( $(num tagged-here "$tagged_here") + $(num tagged-east "$tagged_east") ))"
          echo "tagged-resources-left=$tagged"

          rds="$(count_aws rds-left 501 rds describe-db-instances --endpoint-url "$EP" --region "$R" --query 'length(DBInstances)')"
          if [ "$rds" = "unavailable" ]; then
            echo "rds-left=unavailable (501)"
          else
            echo "rds-left=$rds"
          fi

          alb="$(count_aws alb-left 501 elbv2 describe-load-balancers --endpoint-url "$EP" --region "$R" --query 'length(LoadBalancers)')"
          if [ "$alb" = "unavailable" ]; then
            echo "alb-left=unavailable (501)"
          else
            echo "alb-left=$alb"
          fi

          nat="$(count_aws nat-left no ec2 describe-nat-gateways --endpoint-url "$EP" --region "$R" --filter Name=state,Values=available,pending --query 'length(NatGateways)')"
          echo "nat-left=$nat"

          eip="$(count_aws eip-left no ec2 describe-addresses --endpoint-url "$EP" --region "$R" --query 'length(Addresses)')"
          echo "eip-left=$eip"

          require_zero state-resources-left "$state"
          require_zero tagged-resources-left "$tagged"
          require_zero_or_unavailable rds-left "$rds"
          require_zero_or_unavailable alb-left "$alb"
          require_zero nat-left "$nat"
          require_zero eip-left "$eip"
