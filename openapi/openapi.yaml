openapi: 3.0.3
info:
  title: Marketplace API
  version: 1.0.0
servers:
  - url: http://localhost:3000
security: []
paths: 
  /products:
    get:
      operationId: productsList
      summary: List of products
      parameters: 
        - name: limit
          in: query
          schema: 
            type: integer
        - name: cursor
          in: query
          description: cursor it token position, client send value of next_cursor; opaque, do not parse or construct
          schema:
            type: string
      responses:
        '200': 
          description: Product list response
          content: 
            application/json:
              schema:
                type: object
                required:
                  - items
                  - next_cursor
                properties:
                  items:
                    type: array
                    items: 
                      $ref: '#/components/schemas/Product'
                  next_cursor:
                    type: string
                    nullable: true
        '400':
          description: Not valid request
          content: 
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /products/{id}:
    get:
      operationId: productsItem
      summary: Item of product list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200': 
          description: Item of product list response
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Not found item
          content: 
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders:
    get:
      operationId: ordersList
      summary: List of orders
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: cursor
          in: query
          description: cursor it token position, client send value of next_cursor; opaque, do not parse or construct
          schema:
            type: string
      responses:
        '200':
          description: Order list response
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  next_cursor:
                    type: string
                    nullable: true
        '400':
          description: Not valid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createOrder
      summary: Create an order
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: "Same key and body replay; different body is an error."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Not valid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders/{id}:
    get:
      operationId: ordersItem
      summary: Item of order list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200': 
          description: Item of order list response
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Not found order
          content: 
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      summary: Change order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, completed, cancelled]
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id:
                    type: integer
                  status:
                    type: string
        '400':
          description: Invalid status
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders/{id}/events:
    get:
      operationId: orderStatusEvents
      summary: SSE stream of order status changes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: x-user-id
          in: header
          required: false
          schema:
            type: string
          description: owner user id (same check as Socket.IO join); or pass userId query
        - name: userId
          in: query
          required: false
          schema:
            type: string
          description: alternative to x-user-id
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: text/event-stream of order.status events
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: missing user id (anonymous)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: caller does not own the order
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders/{id}/pay:
    post:
      operationId: createPaymentIntent
      summary: Create payment intent for order (frozen quote + outbox)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: Idempotency-Key
          in: header
          required: false
          description: "Must equal sha256(\"order:\"+id) when set (rule #3). Replay returns same intent."
          schema:
            type: string
      responses:
        '200':
          description: Payment intent created or reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '400':
          description: Bad Idempotency-Key or request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Idempotency-Key conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /webhooks/stub:
    post:
      operationId: stubPaymentWebhook
      summary: Stub provider webhook (HMAC over raw body)
      description: >
        Validated outside OpenAPI (express.raw + HMAC). Documented here for contract
        completeness; runtime path is ignorePaths for raw Buffer verification.
      parameters:
        - name: x-stub-signature
          in: header
          required: true
          schema:
            type: string
            description: hex HMAC-SHA256 of raw body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StubWebhookEvent'
      responses:
        '200':
          description: Applied, duplicate, or unknown-order ack
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResult'
        '400':
          description: Bad signature or amount mismatch (incident)

components:
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: something
        title: 
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      required:
        - type
        - title
        - status
        - detail
        - instance
    Product:
      type: object
      properties:
        id:
          type: integer
    Order:
      type: object
      required:
        - id
        - total_cents
      properties:
        id: 
          type: integer
        total_cents:
          type: integer
        user_id:
          type: integer
          description: Owner user id (for realtime join auth)
    CreateOrder:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: integer
            description: "Product id"
    PaymentIntent:
      type: object
      additionalProperties: false
      required:
        - orderId
        - state
        - providerRef
        - totalMinor
        - idempotencyKey
        - reused
      properties:
        orderId:
          type: string
        state:
          type: string
        providerRef:
          type: string
        checkoutUrl:
          type: string
        totalMinor:
          type: integer
        idempotencyKey:
          type: string
        reused:
          type: boolean
    StubWebhookEvent:
      type: object
      additionalProperties: false
      required:
        - eventId
        - orderId
        - status
        - amountMinor
        - occurredAt
        - providerRef
      properties:
        eventId:
          type: string
        orderId:
          type: string
        status:
          type: string
          enum: [pending, authorized, succeeded, failed, reverted, expired]
        amountMinor:
          type: integer
        occurredAt:
          type: string
          format: date-time
        providerRef:
          type: string
    WebhookResult:
      type: object
      additionalProperties: false
      required:
        - outcome
        - httpStatus
        - note
      properties:
        outcome:
          type: string
        httpStatus:
          type: integer
        note:
          type: string
